<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQMS Login - Prototype</title>
    <style>
        :root {
            --primary: #0d47a1;
            --primary-light: #1976d2;
            --primary-dark: #002171;
            --text: #1a1a2e;
            --border: #e2e8f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; width: 100%; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(160deg, #0d47a1 0%, #1565c0 40%, #1976d2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.2);
            padding: 48px;
            width: 100%;
            max-width: 440px;
        }
        .logo {
            text-align: center;
            margin-bottom: 36px;
        }
        .logo-placeholder {
            width: 84px;
            height: 84px;
            background: #e3f2fd;
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
        }
        .logo h1 {
            color: var(--primary);
            font-size: 22px;
            margin-top: 16px;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: var(--text);
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(13,71,161,0.1);
        }
        .form-group input::placeholder {
            color: #94a3b8;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(13,71,161,0.3);
        }
        .prototype-badge {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: #69f0ae;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            z-index: 100;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="prototype-badge">PROTOTYPE</div>
    <div class="login-container">
        <div class="logo">
            <div class="logo-placeholder">EQMS</div>
            <h1>Queue Management System</h1>
        </div>
        <form onsubmit="return false;">
            <div class="form-group">
                <label>Username</label>
                <input type="text" placeholder="Enter your username" autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Enter your password">
            </div>
            <button type="submit" class="btn-login">Login</button>
        </form>
    </div>
</body>
</html>
