<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d47a1"/>
      <stop offset="40%" style="stop-color:#1565c0"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8f00"/>
      <stop offset="100%" style="stop-color:#ff6f00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="btnShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#ff6f00" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  
  <!-- Decorative circles -->
  <circle cx="1600" cy="-100" r="600" fill="rgba(255,255,255,0.03)"/>
  <circle cx="-100" cy="800" r="400" fill="rgba(255,255,255,0.02)"/>

  <!-- Logo placeholder (circle) -->
  <circle cx="960" cy="280" r="90" fill="rgba(255,255,255,0.15)" filter="url(#shadow)"/>
  <text x="960" y="295" text-anchor="middle" fill="white" font-family="Segoe UI, sans-serif" font-size="48" font-weight="700">EQMS</text>

  <!-- Brand name -->
  <text x="960" y="430" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="Segoe UI, sans-serif" font-size="18" font-weight="500" letter-spacing="6">ALGORISYNC</text>

  <!-- Title -->
  <text x="960" y="500" text-anchor="middle" fill="white" font-family="Segoe UI, sans-serif" font-size="48" font-weight="700">Electronic Queue Management System</text>

  <!-- Subtitle -->
  <text x="960" y="560" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="Segoe UI, sans-serif" font-size="24" font-weight="400">Press the button below to get your ticket</text>

  <!-- GET TICKET Button -->
  <rect x="710" y="620" width="500" height="80" rx="40" fill="url(#btnGrad)" filter="url(#btnShadow)"/>
  <text x="960" y="672" text-anchor="middle" fill="white" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700" letter-spacing="4">GET TICKET</text>

  <!-- Footer -->
  <text x="960" y="1050" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="Segoe UI, sans-serif" font-size="14">Powered by AlgoriSync</text>
</svg>