<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27"/>
      <stop offset="100%" style="stop-color:#111833"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Logo placeholder -->
  <circle cx="960" cy="240" r="70" fill="rgba(255,255,255,0.1)"/>
  <text x="960" y="255" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="Segoe UI, sans-serif" font-size="36" font-weight="700">EQMS</text>

  <!-- Counter Name -->
  <text x="960" y="420" text-anchor="middle" fill="#ff6f00" font-family="Segoe UI, sans-serif" font-size="42" font-weight="600">Counter 1 - General</text>

  <!-- Current Ticket Number (large) -->
  <text x="960" y="640" text-anchor="middle" fill="#69f0ae" font-family="Segoe UI, sans-serif" font-size="200" font-weight="900" letter-spacing="10" filter="url(#glow)">A-012</text>

  <!-- Please Proceed -->
  <text x="960" y="780" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="Segoe UI, sans-serif" font-size="26" font-weight="400" letter-spacing="6">PLEASE PROCEED TO COUNTER</text>

  <!-- Decorative line -->
  <line x1="660" y1="850" x2="1260" y2="850" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <!-- Bottom branding -->
  <text x="960" y="920" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="Segoe UI, sans-serif" font-size="14" letter-spacing="4">ALGORISYNC QUEUE MANAGEMENT</text>
</svg>