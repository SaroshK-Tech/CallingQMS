; PlatformIO project for the EQMS ESP32 + P10 (HUB12) counter display.
;
;   pio run                    build
;   pio run -t upload          flash
;   pio device monitor         serial log (115200)
;
; The sketch is kept as a normal Arduino folder (eqms_display/) so the same
; files open directly in the Arduino IDE too.

[platformio]
src_dir = eqms_display

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; The full WiFi + WebServer + WebSocket + JSON stack is ~1.4 MB, which does not
; fit the default 1.25 MB app partition. The board has 4 MB flash, so use the
; single 3 MB application partition (no OTA).
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    vean/FansElectronics_DMD32@1.1.0
    links2004/WebSockets@2.7.3
    bblanchon/ArduinoJson@7.4.3

build_flags =
    -DCORE_DEBUG_LEVEL=0
